onboarding = false

[theme]
name = "terminal"
auto_switch = false
dark_name = "tokyo-night"
light_name = "catppuccin-latte"

[terminal]
new_cwd = "follow"

[keys]
# Ergonomic Prefix Key
prefix = "ctrl+s"

# Prefix Actions & Management
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+r"                  # Reload config (tmux-style prefix+r)
toggle_sidebar = "prefix+b"                 # Toggle Herdr sidebar

# Workspaces & Tabs Navigation
workspace_picker = "prefix+w"              # Interactive workspace chooser
goto = "prefix+g"                          # Quick jump menu
new_workspace = "prefix+shift+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+alt+p"         # Cycle to previous workspace
next_workspace = "prefix+alt+n"             # Cycle to next workspace
switch_tab = "prefix+1..9"

new_tab = "prefix+c"                        # New tab (tmux-style prefix+c)
rename_tab = "prefix+comma"                 # Rename tab (tmux-style prefix+,)
previous_tab = "prefix+p"                  # Previous tab (tmux-style prefix+p)
next_tab = "prefix+n"                      # Next tab (tmux-style prefix+n)
close_tab = "prefix+shift+x"

# Pane Splitting & Management (Intuitive Vim / Tmux splits)
split_vertical = "prefix+v"                # Vertical split (| or v)
split_horizontal = "prefix+minus"          # Horizontal split (- or s)
close_pane = "prefix+x"                    # Close current pane
zoom = "prefix+z"                          # Fullscreen / Zoom pane toggle (tmux-style prefix+z)
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+e"               # Enter scrollback/copy mode

# Vim-style Pane Navigation (h, j, k, l)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+space"                 # Toggle back and forth to last pane

# Resize mode
resize_mode = "prefix+shift+r"

# Custom Popup Tools (Floating Popups like Tmux Scratchpad / Lazygit / btop)
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "btop"
width = "80%"
height = "80%"

# Direct Shortcut Modifiers (no prefix required)
[keys.indexed]
tabs = "ctrl"
workspaces = "ctrl+shift"
agents = "alt"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_start_collapsed = false
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_gaps = true
accent = "cyan"
hide_tab_bar_when_single_tab = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[experimental]
pane_history = true
